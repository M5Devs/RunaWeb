[package]
name = "runaweb"
version = "0.1.0"
description = "RunaWeb - Offline Web Game Player"
authors = ["RunaWeb"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may only be required if the lib function is used directly or by desktop/mobile targets
name = "runaweb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Minimal permissions required for Pages deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Per-workflow/branch concurrency so different branches / workflows don't deadlock each other
concurrency:
  group: ${{ github.workflow }}-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build and start preview (background)
        id: start-preview
        run: |
          set -euxo pipefail
          # Build the app
          npm run build
          # Start vite preview in background, log output, and save PID
          nohup npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          echo $! > preview.pid
          # Wait for the server to respond (up to ~30s)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ > /dev/null 2>&1; then
              echo "preview ready"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://localhost:4173/ > /dev/null 2>&1; then
            echo "preview did not start"
            cat preview.log || true
            exit 1
          fi
        shell: bash

      - name: Run E2E Tests (Playwright)
        id: playwright-test
        run: |
          set -euxo pipefail
          # Use the installed browsers and run Playwright headless tests
          npx playwright test --project=chromium
        continue-on-error: false

      - name: Upload E2E Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots/

      - name: Teardown preview server (always)
        if: always()
        run: |
          set -euxo pipefail
          if [ -f preview.pid ]; then
            PID=$(cat preview.pid) || true
            if [ -n "$PID" ] && ps -p "$PID" > /dev/null 2>&1; then
              echo "Killing preview PID $PID"
              kill "$PID" || true
              sleep 1
            fi
          fi
          # best-effort kill any leftover vite preview processes
          pkill -f "vite preview" || true
          # show logs for debugging when tests failed
          if [ -f preview.log ]; then
            echo "=== preview.log ==="
            tail -n +1 preview.log || true
          fi

  deploy:
    name: Build & Deploy to GitHub Pages
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Do not set `environment.url` with a steps.* expression — that expression cannot be
    # evaluated at job start and can cause the job evaluation to stall. We set only the environment name here.
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
